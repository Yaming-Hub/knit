[package]
name = "knit-integration-tests"
version = "0.2.0"
edition = "2021"
publish = false
description = "Integration tests for the knit workspace"

[dependencies]
knit-core = { path = "../knit-core" }
knit-schema = { path = "../knit-schema" }
knit-plan = { path = "../knit-plan" }
knit-gen = { path = "../knit-gen" }
knit-learn = { path = "../knit-learn" }
knit-noise = { path = "../knit-noise" }
arrow = { version = "54", features = ["prettyprint"] }

[dev-dependencies]
assert_cmd = "2.2.1"
predicates = "3.1.4"
tempfile = "3.27.0"
serde_json = "1"
