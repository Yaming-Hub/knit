[package]
name = "knit-learn"
version = "0.1.0"
edition = "2021"
description = "Schema inference from existing data sources"

[dependencies]
knit-core = { path = "../knit-core" }
arrow = { version = "54", features = ["prettyprint"] }
arrow-csv = "54"
arrow-json = "54"
parquet = "54"
chrono = "0.4"
regex = "1"
serde_json = "1"
tracing = "0.1"
thiserror = "2"
rand = "0.8"
statrs = "0.17"
rustfft = "6"

[dev-dependencies]
tempfile = "3"
arrow = { version = "54", features = ["prettyprint"] }
rand_distr = "0.4"
