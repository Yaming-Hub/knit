[package]
name = "knit-schema"
version = "0.2.0"
edition = "2021"
description = "Parser and validator for the Weave schema language"

[dependencies]
knit-core = { path = "../knit-core" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
thiserror = "2"

[dev-dependencies]
indoc = "2"
