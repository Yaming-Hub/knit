[package]
name = "knit-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line interface for the Knit toolset"

[[bin]]
name = "knit"
path = "src/main.rs"

[dependencies]
knit-core = { path = "../knit-core" }
knit-schema = { path = "../knit-schema" }
knit-plan = { path = "../knit-plan" }
knit-gen = { path = "../knit-gen" }
knit-noise = { path = "../knit-noise" }
knit-bind = { path = "../knit-bind" }
knit-learn = { path = "../knit-learn" }

clap = { version = "4", features = ["derive"] }
rayon = "1"
indicatif = "0.17"
colored = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
arrow = "54"
anyhow = "1"
dirs = "5"

[dev-dependencies]
tempfile = "3"
indoc = "2"
