[package]
name = "knit-bind"
version = "0.2.0"
edition = "2021"
description = "Output sinks for serializing Arrow RecordBatches to various formats"

[dependencies]
arrow = { version = "54", features = ["csv", "ipc", "json"] }
parquet = { version = "54", features = ["arrow"] }
serde_json = { version = "1", features = ["preserve_order"] }
minijinja = "2"
thiserror = "2"
parking_lot = "0.12"
tracing = "0.1"
chrono = "0.4"

[dev-dependencies]
arrow = { version = "54", features = ["csv", "ipc", "json", "prettyprint"] }
parquet = { version = "54", features = ["arrow"] }
bytes = "1"
