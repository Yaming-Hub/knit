[package]
name = "knit-core"
version = "0.2.0"
edition = "2021"
description = "Semantic model types for the Knit synthetic data toolset"

[dependencies]
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
toml = "0.8"
