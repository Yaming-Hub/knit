# WASM Plugin Example
#
# Demonstrates loading a custom WASM generator plugin.
# The `random_float` plugin generates random floats in a configurable range.
#
# Build the plugin first:
#   cd examples/wasm_plugin && cargo build --target wasm32-wasip1 --release
#
# Then generate:
#   knit generate examples/wasm_plugin_demo.weave.toml -o output \
#     --plugin examples/wasm_plugin/target/wasm32-wasip1/release/knit_example_wasm_plugin.wasm

schema_version = "1.0"

[model]
name = "wasm_plugin_demo"
description = "Demonstrates WASM plugin generator"
seed = 42

[[entities]]
name = "measurements"
count = 100

[[entities.fields]]
name = "id"
data_type = "int"
primary_key = true
[entities.fields.generator]
type = "sequence"
start = 1
step = 1

[[entities.fields]]
name = "score"
data_type = "float"
description = "Random score generated by the random_float WASM plugin"
[entities.fields.generator]
type = "plugin"
name = "random_float"
[entities.fields.generator.params]
min = 0.0
max = 100.0

[[entities.fields]]
name = "label"
data_type = "string"
[entities.fields.generator]
type = "one_of"
choices = [
    { value = "A", weight = 0.34 },
    { value = "B", weight = 0.33 },
    { value = "C", weight = 0.33 },
]
