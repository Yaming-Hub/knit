schema_version = "1.0"

[model]
name = "pipe_operator"
description = "Demonstrates the pipe operator |> for expression composition"
seed = 42

[[entities]]
name = "products"
count = 100

[[entities.fields]]
name = "id"
data_type = "int"
primary_key = true
[entities.fields.generator]
type = "sequence"
start = 1
step = 1

[[entities.fields]]
name = "base_price"
data_type = "float"
[entities.fields.generator]
type = "distribution"
kind = "uniform"
[entities.fields.generator.params]
min = 5.0
max = 200.0

[[entities.fields]]
name = "tax_rate"
data_type = "float"
[entities.fields.generator]
type = "distribution"
kind = "uniform"
[entities.fields.generator.params]
min = 0.05
max = 0.15

# Use pipe operator to chain computations:
# base_price * (1 + tax_rate) |> round(2)  ≡  round(base_price * (1 + tax_rate), 2)
[[entities.fields]]
name = "total_price"
data_type = "float"
[entities.fields.generator]
type = "derived"
expr = "${base_price} * (1.0 + ${tax_rate}) |> round(2)"

# Chained pipes: compute discount then clamp
# base_price * 0.9 |> round(2) |> max(10.0)
#   ≡ max(round(base_price * 0.9, 2), 10.0)
[[entities.fields]]
name = "discounted_price"
data_type = "float"
[entities.fields.generator]
type = "derived"
expr = "${base_price} * 0.9 |> round(2) |> max(10.0)"

[[entities.fields]]
name = "product_name"
data_type = "string"
[entities.fields.generator]
type = "one_of"
choices = [
    { value = "Widget" },
    { value = "Gadget" },
    { value = "Sprocket" },
    { value = "Doohickey" },
]

# Pipe with string function: uppercase the product name
[[entities.fields]]
name = "display_name"
data_type = "string"
[entities.fields.generator]
type = "derived"
expr = "${product_name} |> upper()"
