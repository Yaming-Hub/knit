# Modular e-commerce schema composed from reusable fragments.
#
# This schema includes users and products from separate fragment files,
# then adds orders and relationships on top.

include = ["users.knit.toml", "products.knit.toml"]

[model]
name = "modular_ecommerce"
description = "E-commerce dataset assembled from reusable schema fragments"
seed = 42

# Orders entity (defined here, not in a fragment)
[[entities]]
name = "orders"
count = 5000
description = "Customer orders"

[[entities.fields]]
name = "order_id"
data_type = "int"
primary_key = true
[entities.fields.generator]
type = "sequence"

[[entities.fields]]
name = "user_id"
data_type = "int"

[[entities.fields]]
name = "product_id"
data_type = "int"

[[entities.fields]]
name = "quantity"
data_type = "int"
[entities.fields.generator]
type = "distribution"
kind = "zipf"
[entities.fields.generator.params]
n = 10
s = 1.5

[[entities.fields]]
name = "total"
data_type = "float"
precision = 2
[entities.fields.generator]
type = "distribution"
kind = "log_normal"
[entities.fields.generator.params]
mu = 3.0
sigma = 1.0

[[entities.fields]]
name = "ordered_at"
data_type = "datetime"
[entities.fields.generator]
type = "distribution"
kind = "uniform"
[entities.fields.generator.params]
min = 1704067200.0
max = 1735689600.0

# Relationships
[[relationships]]
name = "orders_to_users"
from = "orders"
to = "users"
kind = "many_to_one"
foreign_key = "user_id"

[[relationships]]
name = "orders_to_products"
from = "orders"
to = "products"
kind = "many_to_one"
foreign_key = "product_id"
