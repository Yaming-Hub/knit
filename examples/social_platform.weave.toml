schema_version = "1.0"

[model]
name = "social_platform"
description = """
Social platform demonstrating behavioral modeling: persona definitions with
activity-weighted FK generation, actor relationship graphs, and graph
topologies. Actor columns sample users proportional to persona activity_rate.
"""
seed = 20240601
# Time horizon: ~1 month snapshot of a medium-activity community.

# ── Personas ─────────────────────────────────────────────────────────
# Define behavioral profiles that drive how actors interact.
# Trait units: activity_rate = actions/month, post_frequency = posts/month,
# session_length = minutes, reply_ratio = fraction of reads that get a reply.

[[personas]]
name = "power_user"
weight = 0.15
[personas.traits]
activity_rate = 80.0
session_length = 45.0
post_frequency = 12.0
reply_ratio = 0.7

[[personas]]
name = "regular_user"
weight = 0.55
[personas.traits]
activity_rate = 20.0
session_length = 15.0
post_frequency = 3.0
reply_ratio = 0.4

[[personas]]
name = "lurker"
weight = 0.30
[personas.traits]
activity_rate = 3.0
session_length = 5.0
post_frequency = 0.2
reply_ratio = 0.1

# ── Actor Relationships ──────────────────────────────────────────────
# Defines the social graph topology between actors.

[[actor_relationships]]
name = "follows"
from_entity = "users"
to_entity = "users"
graph_type = "scale_free"
[actor_relationships.params]
avg_degree = 8.0
reciprocity = 0.3

[[actor_relationships]]
name = "messages"
from_entity = "users"
to_entity = "users"
graph_type = "small_world"
[actor_relationships.params]
avg_degree = 4.0
rewire_probability = 0.15
reciprocity = 0.6

# ── Entities ─────────────────────────────────────────────────────────

# Actor entity — represents the user population
[[entities]]
name = "users"
count = 500
actor = true
persona_distribution = "personas"

[[entities.fields]]
name = "id"
data_type = "int"
primary_key = true
[entities.fields.generator]
type = "sequence"
start = 1
step = 1

[[entities.fields]]
name = "username"
data_type = "string"
unique = true
[entities.fields.generator]
type = "faker"
method = "username"
args = []

[[entities.fields]]
name = "email"
data_type = "string"
unique = true
[entities.fields.generator]
type = "pattern"
pattern = "user####@socialapp.io"

[[entities.fields]]
name = "signup_date"
data_type = "datetime"

[[entities.fields]]
name = "tier"
data_type = "string"
[entities.fields.generator]
type = "one_of"
choices = [
    { value = "free", weight = 0.6 },
    { value = "pro", weight = 0.3 },
    { value = "enterprise", weight = 0.1 },
]

# Behavioral entity — posts generated by users
[[entities]]
name = "posts"
count = 5000

[[entities.fields]]
name = "id"
data_type = "int"
primary_key = true
[entities.fields.generator]
type = "sequence"
start = 1
step = 1

[[entities.fields]]
name = "author_id"
data_type = "int"
actor_column = true

[[entities.fields]]
name = "content"
data_type = "string"
[entities.fields.generator]
type = "faker"
method = "paragraph"
args = ["2"]

[[entities.fields]]
name = "created_at"
data_type = "datetime"

[[entities.fields]]
name = "likes_count"
data_type = "int"
[entities.fields.generator]
type = "distribution"
kind = "poisson"
[entities.fields.generator.params]
lambda = 25.0

# Behavioral entity — comments on posts
[[entities]]
name = "comments"
count = 15000

[[entities.fields]]
name = "id"
data_type = "int"
primary_key = true
[entities.fields.generator]
type = "sequence"
start = 1
step = 1

[[entities.fields]]
name = "post_id"
data_type = "int"

[[entities.fields]]
name = "author_id"
data_type = "int"
actor_column = true

[[entities.fields]]
name = "body"
data_type = "string"
[entities.fields.generator]
type = "faker"
method = "sentence"
args = []

[[entities.fields]]
name = "created_at"
data_type = "datetime"

# Direct messages — driven by the "messages" relationship graph
[[entities]]
name = "direct_messages"
count = 8000

[[entities.fields]]
name = "id"
data_type = "int"
primary_key = true
[entities.fields.generator]
type = "sequence"
start = 1
step = 1

[[entities.fields]]
name = "sender_id"
data_type = "int"
actor_column = true

[[entities.fields]]
name = "receiver_id"
data_type = "int"
[entities.fields.generator]
type = "relationship_ref"
relationship = "messages"
source_field = "sender_id"

[[entities.fields]]
name = "message"
data_type = "string"
[entities.fields.generator]
type = "faker"
method = "sentence"
args = []

[[entities.fields]]
name = "sent_at"
data_type = "datetime"

[[entities.fields]]
name = "read"
data_type = "bool"
[entities.fields.generator]
type = "one_of"
choices = [
    { value = true, weight = 0.75 },
    { value = false, weight = 0.25 },
]

# ── Relationships ────────────────────────────────────────────────────

[[relationships]]
name = "post_author"
from = "posts"
to = "users"
kind = "many_to_one"
foreign_key = "author_id"

[[relationships]]
name = "comment_post"
from = "comments"
to = "posts"
kind = "many_to_one"
foreign_key = "post_id"

[[relationships]]
name = "comment_author"
from = "comments"
to = "users"
kind = "many_to_one"
foreign_key = "author_id"

[[relationships]]
name = "dm_sender"
from = "direct_messages"
to = "users"
kind = "many_to_one"
foreign_key = "sender_id"

[[relationships]]
name = "dm_receiver"
from = "direct_messages"
to = "users"
kind = "many_to_one"
foreign_key = "receiver_id"
