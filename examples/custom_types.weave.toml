# Custom Domain Types Example
#
# Demonstrates defining reusable type aliases with default generators,
# precision, and nullable settings.

schema_version = "1.0"

[model]
name = "custom_types_demo"
seed = 42

# ── Custom Types ────────────────────────────────────────────

[[types]]
name = "money"
description = "Monetary amount with 2 decimal places"
base = "float"
precision = 2
[types.generator]
type = "distribution"
kind = "log_normal"
params = { mu = 4.0, sigma = 0.8 }

[[types]]
name = "percentage"
description = "A value between 0 and 100"
base = "float"
precision = 1
[types.generator]
type = "distribution"
kind = "uniform"
params = { min = 0.0, max = 100.0 }

[[types]]
name = "email_address"
description = "Email string generated by faker"
base = "string"
[types.generator]
type = "faker"
method = "email"

[[types]]
name = "phone"
description = "Phone number string"
base = "string"
[types.generator]
type = "faker"
method = "phone"

# ── Entities ────────────────────────────────────────────────

[[entities]]
name = "customer"
count = 100

[[entities.fields]]
name = "id"
data_type = "int"
primary_key = true
[entities.fields.generator]
type = "sequence"
start = 1
step = 1

[[entities.fields]]
name = "name"
data_type = "string"
[entities.fields.generator]
type = "faker"
method = "name"

[[entities.fields]]
name = "email"
data_type = "email_address"

[[entities.fields]]
name = "phone"
data_type = "phone"
nullable = { probability = 0.1 }

[[entities.fields]]
name = "discount"
data_type = "percentage"

# ── Orders using the money type ─────────────────────────────

[[entities]]
name = "order"
count = 500

[[entities.fields]]
name = "id"
data_type = "int"
[entities.fields.generator]
type = "sequence"
start = 1
step = 1

[[entities.fields]]
name = "customer_id"
data_type = "int"

[[entities.fields]]
name = "subtotal"
data_type = "money"

[[entities.fields]]
name = "tax"
data_type = "money"

# Override the custom type's generator for this specific field
[[entities.fields]]
name = "shipping"
data_type = "money"
[entities.fields.generator]
type = "distribution"
kind = "uniform"
params = { min = 0.0, max = 25.0 }

# ── Relationships ───────────────────────────────────────────

[[relationships]]
name = "order_customer"
from = "order"
to = "customer"
kind = "many_to_one"
foreign_key = "customer_id"
