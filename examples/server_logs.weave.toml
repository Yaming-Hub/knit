schema_version = "1.0"

[model]
name = "server_logs"
description = "Web server request and error logs as event streams"
seed = 20240301

# ── Servers ──────────────────────────────────────────────────────────

[[entities]]
name = "servers"
count = 10

[[entities.fields]]
name = "id"
data_type = "int"
primary_key = true
[entities.fields.generator]
type = "sequence"
start = 1
step = 1

[[entities.fields]]
name = "hostname"
data_type = "string"
[entities.fields.generator]
type = "pattern"
pattern = "web-[a-z]{2}-[0-9]{2}"

[[entities.fields]]
name = "region"
data_type = "string"
[entities.fields.generator]
type = "one_of"
choices = [
    { value = "us-east-1", weight = 0.35 },
    { value = "us-west-2", weight = 0.25 },
    { value = "eu-west-1", weight = 0.25 },
    { value = "ap-southeast-1", weight = 0.15 },
]

[[entities.fields]]
name = "cpu_cores"
data_type = "int"
[entities.fields.generator]
type = "one_of"
choices = [
    { value = 4 },
    { value = 8 },
    { value = 16 },
    { value = 32 },
]

# ── Requests ─────────────────────────────────────────────────────────

[[entities]]
name = "requests"
count = 20000

[[entities.fields]]
name = "id"
data_type = "int"
primary_key = true
[entities.fields.generator]
type = "sequence"
start = 1
step = 1

[[entities.fields]]
name = "server_id"
data_type = "int"

[[entities.fields]]
name = "method"
data_type = "string"
[entities.fields.generator]
type = "one_of"
choices = [
    { value = "GET", weight = 0.60 },
    { value = "POST", weight = 0.20 },
    { value = "PUT", weight = 0.10 },
    { value = "DELETE", weight = 0.05 },
    { value = "PATCH", weight = 0.05 },
]

[[entities.fields]]
name = "path"
data_type = "string"
[entities.fields.generator]
type = "one_of"
choices = [
    { value = "/api/users", weight = 0.25 },
    { value = "/api/orders", weight = 0.20 },
    { value = "/api/products", weight = 0.20 },
    { value = "/api/health", weight = 0.15 },
    { value = "/api/search", weight = 0.10 },
    { value = "/api/auth", weight = 0.10 },
]

[[entities.fields]]
name = "status_code"
data_type = "int"
[entities.fields.generator]
type = "one_of"
choices = [
    { value = 200, weight = 0.70 },
    { value = 201, weight = 0.08 },
    { value = 204, weight = 0.04 },
    { value = 301, weight = 0.02 },
    { value = 400, weight = 0.05 },
    { value = 401, weight = 0.03 },
    { value = 404, weight = 0.04 },
    { value = 500, weight = 0.03 },
    { value = 503, weight = 0.01 },
]

[[entities.fields]]
name = "response_time_ms"
data_type = "float"
[entities.fields.generator]
type = "distribution"
kind = "log_normal"
[entities.fields.generator.params]
mu = 4.0
sigma = 1.2

[[entities.fields]]
name = "bytes_sent"
data_type = "int"
[entities.fields.generator]
type = "distribution"
kind = "pareto"
[entities.fields.generator.params]
scale = 256.0
shape = 1.2

[[entities.fields]]
name = "user_agent"
data_type = "string"
[entities.fields.generator]
type = "one_of"
choices = [
    { value = "Mozilla/5.0 Chrome", weight = 0.40 },
    { value = "Mozilla/5.0 Firefox", weight = 0.20 },
    { value = "Mozilla/5.0 Safari", weight = 0.15 },
    { value = "curl/7.88", weight = 0.10 },
    { value = "python-requests/2.31", weight = 0.15 },
]

# ── Errors ───────────────────────────────────────────────────────────

[[entities]]
name = "errors"
count = 1000

[[entities.fields]]
name = "id"
data_type = "int"
primary_key = true
[entities.fields.generator]
type = "sequence"
start = 1
step = 1

[[entities.fields]]
name = "server_id"
data_type = "int"

[[entities.fields]]
name = "level"
data_type = "string"
[entities.fields.generator]
type = "one_of"
choices = [
    { value = "ERROR", weight = 0.60 },
    { value = "WARN", weight = 0.30 },
    { value = "FATAL", weight = 0.10 },
]

[[entities.fields]]
name = "error_code"
data_type = "string"
[entities.fields.generator]
type = "one_of"
choices = [
    { value = "TIMEOUT", weight = 0.25 },
    { value = "CONNECTION_REFUSED", weight = 0.20 },
    { value = "OOM", weight = 0.15 },
    { value = "DISK_FULL", weight = 0.10 },
    { value = "AUTH_FAILED", weight = 0.15 },
    { value = "RATE_LIMITED", weight = 0.15 },
]

[[entities.fields]]
name = "message"
data_type = "string"
[entities.fields.generator]
type = "faker"
method = "sentence"
args = []

[[entities.fields]]
name = "stack_trace"
data_type = "string"
nullable = { probability = 0.4 }
[entities.fields.generator]
type = "pattern"
pattern = "at [a-z_]+::[a-z_]+\\(\\) line [0-9]{2,3}"

# ── Relationships ────────────────────────────────────────────────────

[[relationships]]
name = "request_server"
from = "requests"
to = "servers"
kind = "many_to_one"
foreign_key = "server_id"

[[relationships]]
name = "error_server"
from = "errors"
to = "servers"
kind = "many_to_one"
foreign_key = "server_id"
