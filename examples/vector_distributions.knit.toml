# Dirichlet and Multinomial Distributions Example
#
# Demonstrates vector-valued distributions:
# - Dirichlet: generates probability simplex (proportions summing to 1.0)
# - Multinomial: generates integer counts distributed across categories

[model]
name = "vector_distributions"
seed = 42

# ── Market Share (Dirichlet) ────────────────────────────────────────

[[entities]]
name = "market_share"
count = 100

[[entities.fields]]
name = "id"
data_type = "int"
[entities.fields.generator]
type = "sequence"

# Three-way market share proportions — always sum to 1.0
# Higher alpha = more concentrated around the mean proportion
[[entities.fields]]
name = "share"
data_type = "array"
[entities.fields.generator]
type = "distribution"
kind = "dirichlet"
[entities.fields.generator.array_params]
alpha = [5.0, 3.0, 2.0]

# ── Survey Responses (Multinomial) ──────────────────────────────────

[[entities]]
name = "survey_results"
count = 50

[[entities.fields]]
name = "respondent_id"
data_type = "int"
[entities.fields.generator]
type = "sequence"

# Each respondent distributes 10 points across 4 options
[[entities.fields]]
name = "votes"
data_type = "array"
[entities.fields.generator]
type = "distribution"
kind = "multinomial"
[entities.fields.generator.params]
n = 10
[entities.fields.generator.array_params]
p = [0.4, 0.3, 0.2, 0.1]

# ── Output ──────────────────────────────────────────────────────────

[[sinks]]
entity = "market_share"
format = "json"

[[sinks]]
entity = "survey_results"
format = "json"
