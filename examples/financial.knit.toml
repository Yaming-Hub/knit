blueprint_version = "1.0"

[model]
name = "financial"
description = "Banking accounts and transactions with correlated fields"
seed = 20240401

# ── Accounts ─────────────────────────────────────────────────────────

[[entities]]
name = "accounts"
count = 500

[[entities.fields]]
name = "id"
data_type = "int"
primary_key = true
[entities.fields.generator]
type = "sequence"
start = 1
step = 1

[[entities.fields]]
name = "account_number"
data_type = "string"
[entities.fields.generator]
type = "pattern"
pattern = "####-####-####"

[[entities.fields]]
name = "account_type"
data_type = "string"
[entities.fields.generator]
type = "one_of"
choices = [
    { value = "checking", weight = 0.45 },
    { value = "savings", weight = 0.35 },
    { value = "investment", weight = 0.15 },
    { value = "credit", weight = 0.05 },
]

[[entities.fields]]
name = "balance"
data_type = "float"
precision = 2
[entities.fields.generator]
type = "distribution"
kind = "log_normal"
[entities.fields.generator.params]
mu = 8.5
sigma = 2.0

[[entities.fields]]
name = "currency"
data_type = "string"
[entities.fields.generator]
type = "one_of"
choices = [
    { value = "USD", weight = 0.60 },
    { value = "EUR", weight = 0.20 },
    { value = "GBP", weight = 0.10 },
    { value = "JPY", weight = 0.10 },
]

[[entities.fields]]
name = "is_active"
data_type = "bool"
[entities.fields.generator]
type = "distribution"
kind = "bernoulli"
[entities.fields.generator.params]
p = 0.90

[[entities.fields]]
name = "risk_score"
data_type = "float"
precision = 3
[entities.fields.generator]
type = "distribution"
kind = "beta"
[entities.fields.generator.params]
alpha = 2.0
beta = 5.0

# ── Transactions ─────────────────────────────────────────────────────

[[entities]]
name = "transactions"
count = 10000

[[entities.fields]]
name = "id"
data_type = "int"
primary_key = true
[entities.fields.generator]
type = "sequence"
start = 1
step = 1

[[entities.fields]]
name = "account_id"
data_type = "int"

[[entities.fields]]
name = "tx_type"
data_type = "string"
[entities.fields.generator]
type = "one_of"
choices = [
    { value = "deposit", weight = 0.30 },
    { value = "withdrawal", weight = 0.25 },
    { value = "transfer", weight = 0.20 },
    { value = "payment", weight = 0.15 },
    { value = "fee", weight = 0.10 },
]

[[entities.fields]]
name = "amount"
data_type = "float"
precision = 2
[entities.fields.generator]
type = "distribution"
kind = "log_normal"
[entities.fields.generator.params]
mu = 4.5
sigma = 1.5

[[entities.fields]]
name = "description"
data_type = "string"
nullable = { probability = 0.2 }
[entities.fields.generator]
type = "faker"
method = "sentence"
args = []

[[entities.fields]]
name = "channel"
data_type = "string"
[entities.fields.generator]
type = "one_of"
choices = [
    { value = "online", weight = 0.40 },
    { value = "mobile", weight = 0.30 },
    { value = "atm", weight = 0.15 },
    { value = "branch", weight = 0.10 },
    { value = "phone", weight = 0.05 },
]

[[entities.fields]]
name = "is_flagged"
data_type = "bool"
[entities.fields.generator]
type = "distribution"
kind = "bernoulli"
[entities.fields.generator.params]
p = 0.02

# ── Relationships ────────────────────────────────────────────────────

[[relationships]]
name = "transaction_account"
from = "transactions"
to = "accounts"
kind = "many_to_one"
foreign_key = "account_id"

# ── Correlations ─────────────────────────────────────────────────────

[[correlations]]
entity = "accounts"
fields = ["balance", "risk_score"]
matrix = [[1.0, -0.4], [-0.4, 1.0]]
