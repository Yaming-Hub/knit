# Sequence Jitter & Temporal Sequences Example
#
# Demonstrates:
# 1. Temporal sequences with string date/datetime starts and duration steps
# 2. The `jitter` parameter for realistic irregular timestamps

[model]
name = "sequence_jitter_demo"
seed = 42

# ── Daily sensor readings with temporal sequences ─────────────
[[entities]]
name = "sensor_reading"
count = 30

[[entities.fields]]
name = "id"
data_type = "int"
generator = { type = "sequence", start = 1, step = 1 }

# Temporal sequence: string date start + duration step.
# Produces epoch-ms timestamps starting 2024-01-01, stepping 1 day,
# with ±30-minute jitter for realistic irregularity.
[[entities.fields]]
name = "reading_time"
data_type = "datetime"
generator = { type = "sequence", start = "2024-01-01", step = "1d", jitter = "30m" }

# Hourly datetime sequence with ±5-minute wobble
[[entities.fields]]
name = "hourly_check"
data_type = "datetime"
generator = { type = "sequence", start = "2024-06-15T08:00:00", step = "1h", jitter = "5m" }

# Integer sequence with epoch-ms values also works
[[entities.fields]]
name = "raw_epoch_ms"
data_type = "int"
generator = { type = "sequence", start = 1704067200000, step = 86400000, jitter = "30m" }

[[entities.fields]]
name = "value"
data_type = "float"
[entities.fields.generator]
type = "distribution"
kind = "normal"
[entities.fields.generator.params]
mean = 22.0
std_dev = 3.0
