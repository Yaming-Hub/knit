[package]
name = "knit"
version = "0.4.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/Yaming-Hub/knit"
homepage = "https://github.com/Yaming-Hub/knit"
description = "Deterministic synthetic data generation toolset"
documentation = "https://docs.rs/knit"
readme = "README.md"
keywords = ["synthetic-data", "data-generation", "testing", "faker", "parquet"]
categories = ["command-line-utilities", "development-tools::testing", "simulation"]
exclude = [".github/", "docs/", "benches/", ".editorconfig", "agents.md", "deny.toml"]

[[bin]]
name = "knit"
path = "src/main.rs"

[lib]
name = "knit"
path = "src/lib.rs"

[dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1"
csv = "1"

# Arrow / Parquet / Avro
arrow = { version = "58", features = ["csv", "ipc", "json", "prettyprint"] }
arrow-csv = "58"
arrow-json = "58"
parquet = { version = "58", features = ["arrow"] }
apache-avro = { version = "0.21", features = ["snappy"] }

# Random / Math
rand = { version = "0.10", features = ["chacha"] }
rand_distr = "0.6"
statrs = "0.18"
rustfft = "6"

# Concurrency
rayon = "1"
parking_lot = "0.12"

# Error handling
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
colored = "3"
indicatif = "0.18"

# Logging
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
petgraph = "0.8"
siphasher = "1"
bitflags = "2"
minijinja = "2"
bytes = "1"
dirs = "6"
tempfile = "3"
indoc = "2"

# WASM plugin support (optional)
wasmtime = { version = "44", optional = true, default-features = false, features = ["cranelift", "runtime"] }

[features]
default = []
wasm-plugins = ["dep:wasmtime"]

[dev-dependencies]
assert_cmd = "2.2"
criterion = { version = "0.8", features = ["html_reports"] }
predicates = "3.1"
proptest = "1.11.0"

[[bench]]
name = "generation"
harness = false

[[bench]]
name = "temporal"
harness = false
