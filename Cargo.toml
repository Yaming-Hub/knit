[workspace]
members = [
    "crates/knit-core",
    "crates/knit-schema",
    "crates/knit-plan",
    "crates/knit-gen",
    "crates/knit-noise",
    "crates/knit-bind",
    "crates/knit-learn",
    "crates/knit-cli",
    "crates/knit-integration-tests",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/Yaming-Hub/knit"
