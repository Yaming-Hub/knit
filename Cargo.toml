[package]
name = "knit"
version = "0.3.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/Yaming-Hub/knit"
description = "Deterministic synthetic data generation toolset"
readme = "README.md"
keywords = ["synthetic-data", "data-generation", "testing", "faker", "parquet"]
categories = ["command-line-utilities", "development-tools::testing", "simulation"]

[[bin]]
name = "knit"
path = "src/main.rs"

[lib]
name = "knit"
path = "src/lib.rs"

[dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
csv = "1"

# Arrow / Parquet
arrow = { version = "54", features = ["csv", "ipc", "json", "prettyprint"] }
arrow-csv = "54"
arrow-json = "54"
parquet = { version = "54", features = ["arrow"] }

# Random / Math
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
statrs = "0.17"
rustfft = "6"

# Concurrency
rayon = "1"
parking_lot = "0.12"

# Error handling
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
colored = "2"
indicatif = "0.17"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
petgraph = "0.7"
siphasher = "1"
bitflags = "2"
minijinja = "2"
bytes = "1"
dirs = "5"
tempfile = "3"
indoc = "2"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3"
